distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 8.13（上游是 8.9-bin）：AGP 8.7.3 需要 Gradle 8.9+，且 8.13 在 devtools\gradle-home
# 里已有缓存，用官方 URL 能直接命中、零下载。
# 若换机器没缓存，改用国内镜像（services.gradle.org 会 307 跳到 github，国内不可达）：
#   https://mirrors.cloud.tencent.com/gradle/gradle-8.13-all.zip
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip
networkTimeout=30000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
