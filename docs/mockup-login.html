<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机掌柜 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0A0E14',
                        primary: '#4A90E2',
                        accent: '#7C5CFF',
                        success: '#00E5A0',
                        warning: '#FF9F43',
                        danger: '#FF5E7A',
                        gold: '#FFD166',
                        t1: '#E8EDF5',
                        t2: '#8A9BB5',
                        t3: '#4A5A70',
                        cardBg: 'rgba(13,17,23,0.75)',
                        border: '#1E2A3A'
                    },
                    fontFamily: {
                        sans: ["-apple-system", "'SF Pro Display'", "'PingFang SC'", "'Noto Sans SC'", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { background: #0A0E14; }
        
        .glass-card {
            background: rgba(13,17,23,0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid #1E2A3A;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(74,144,226,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
        }
        
        .blue-gradient {
            background: linear-gradient(135deg, #4A90E2, #60A5FA);
        }
        
        .hero-gradient {
            background: linear-gradient(135deg, #4A90E2, #7C5CFF, #4A90E2);
        }
        
        .glow-blue {
            box-shadow: 0 0 20px rgba(74,144,226,0.4);
        }
        
        .logo-gradient {
            background: linear-gradient(135deg, #4A90E2, #7C5CFF);
        }
        
        /* Scan line animation */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00D4FF, #4A90E2, transparent);
            animation: scan 3s linear infinite;
            z-index: 100;
            opacity: 0.6;
        }
        
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        
        /* Grid background pattern */
        .grid-bg {
            background-image: 
                linear-gradient(rgba(74,144,226,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74,144,226,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        .input-glass {
            background: rgba(30,42,58,0.6);
            border: 1px solid rgba(74,144,226,0.2);
            transition: all 150ms ease;
        }
        
        .input-glass:focus {
            border-color: #4A90E2;
            box-shadow: 0 0 15px rgba(74,144,226,0.25);
            outline: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4A90E2, #60A5FA);
            transition: all 150ms ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(74,144,226,0.5);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .brand-panel {
            background: linear-gradient(135deg, rgba(74,144,226,0.15), rgba(124,92,255,0.1)), 
                        linear-gradient(135deg, #0A0E14 0%, #1a1f2e 100%);
        }
        
        @media (min-width: 760px) {
            .desktop-split {
                display: flex;
            }
            .mobile-only {
                display: none;
            }
        }
        
        @media (max-width: 759px) {
            .desktop-split {
                display: block;
            }
            .desktop-only {
                display: none;
            }
        }
    </style>
</head>
<body class="font-sans text-t1 min-h-screen grid-bg overflow-hidden">
    <!-- Scan line effect -->
    <div class="scan-line"></div>
    
    <!-- Mobile Layout (default) -->
    <div class="desktop-split min-h-screen flex">
        <!-- Desktop Left Brand Panel -->
        <div class="desktop-only w-[60%] relative overflow-hidden">
            <div class="brand-panel absolute inset-0">
                <!-- Decorative elements -->
                <div class="absolute top-20 left-20 w-64 h-64 rounded-full bg-primary/10 blur-3xl"></div>
                <div class="absolute bottom-40 right-20 w-80 h-80 rounded-full bg-accent/10 blur-3xl"></div>
                
                <!-- Brand content -->
                <div class="relative z-10 flex flex-col items-center justify-center h-full px-16">
                    <div class="mb-8 text-center">
                        <div class="w-20 h-20 mx-auto mb-6 rounded-2xl logo-gradient flex items-center justify-center glow-blue">
                            <span class="material-icons text-white text-4xl">store</span>
                        </div>
                        <h1 class="text-4xl font-bold text-white mb-3">Business Cockpit</h1>
                        <p class="text-t2 text-lg">智能商业管理驾驶舱</p>
                    </div>
                    
                    <!-- Feature list -->
                    <div class="space-y-4 mt-8 w-full max-w-sm">
                        <div class="flex items-center gap-4 text-t2">
                            <div class="w-10 h-10 rounded-lg bg-primary/20 flex items-center justify-center">
                                <span class="material-icons text-primary text-xl">inventory_2</span>
                            </div>
                            <span>实时库存追踪</span>
                        </div>
                        <div class="flex items-center gap-4 text-t2">
                            <div class="w-10 h-10 rounded-lg bg-accent/20 flex items-center justify-center">
                                <span class="material-icons text-accent text-xl">analytics</span>
                            </div>
                            <span>智能经营分析</span>
                        </div>
                        <div class="flex items-center gap-4 text-t2">
                            <div class="w-10 h-10 rounded-lg bg-success/20 flex items-center justify-center">
                                <span class="material-icons text-success text-xl">speed</span>
                            </div>
                            <span>高效周转管理</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Form Panel -->
        <div class="w-full md:w-[40%] flex items-center justify-center p-6">
            <div class="w-full max-w-[320px]">
                <!-- Mobile Logo -->
                <div class="mobile-only text-center mb-8 pt-16">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-xl logo-gradient flex items-center justify-center glow-blue">
                        <span class="material-icons text-white text-3xl">store</span>
                    </div>
                    <h1 class="text-2xl font-bold text-white">机掌柜</h1>
                    <p class="text-t2 text-sm mt-1">二手iPad进销存管理</p>
                </div>
                
                <!-- Login Card -->
                <div class="glass-card rounded-2xl p-6">
                    <h2 class="desktop-only text-xl font-bold text-center mb-6 text-white">登录账号</h2>
                    
                    <!-- Username -->
                    <div class="mb-4">
                        <div class="relative">
                            <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-t2 text-xl">person</span>
                            <input 
                                type="text" 
                                placeholder="请输入用户名" 
                                class="input-glass w-full py-3 pl-11 pr-4 rounded-xl text-t1 placeholder-t3"
                            >
                        </div>
                    </div>
                    
                    <!-- Password -->
                    <div class="mb-4">
                        <div class="relative">
                            <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-t2 text-xl">lock</span>
                            <input 
                                type="password" 
                                id="password" 
                                placeholder="请输入密码" 
                                class="input-glass w-full py-3 pl-11 pr-12 rounded-xl text-t1 placeholder-t3"
                            >
                            <button 
                                type="button"
                                onclick="togglePassword()"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-t2 hover:text-t1 transition-colors"
                            >
                                <span class="material-icons text-xl" id="eye-icon">visibility_off</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Remember & Forgot -->
                    <div class="flex items-center justify-between mb-6">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" class="w-4 h-4 rounded accent-primary">
                            <span class="text-t2 text-sm group-hover:text-t1 transition-colors">记住登录</span>
                        </label>
                        <a href="#" class="text-t2 text-sm hover:text-primary transition-colors">忘记密码？</a>
                    </div>
                    
                    <!-- Login Button -->
                    <button class="btn-primary w-full py-3 rounded-xl text-white font-bold text-base glow-blue">
                        登录
                    </button>
                    
                    <!-- Register Link -->
                    <p class="text-center mt-4">
                        <span class="text-t2 text-sm">还没有账号？</span>
                        <a href="#" class="text-primary hover:text-blue-400 transition-colors text-sm ml-1 font-medium">注册账号</a>
                    </p>
                </div>
                
                <!-- Security Footer -->
                <div class="flex items-center justify-center gap-2 mt-6 text-t3 text-xs">
                    <span class="material-icons text-sm">lock</span>
                    <span>安全传输 · 数据加密</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility_off';
            }
        }
    </script>
</body>
</html>
