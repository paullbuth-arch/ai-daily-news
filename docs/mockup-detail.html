<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>设备详情 - 机掌柜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0A0E14',
            primary: '#4A90E2',
            accent: '#7C5CFF',
            success: '#00E5A0',
            warning: '#FF9F43',
            danger: '#FF5E7A',
            gold: '#FFD166',
            t1: '#E8EDF5',
            t2: '#8A9BB5',
            t3: '#4A5A70',
          },
          fontFamily: {
            sans: ['-apple-system', 'SF Pro Display', 'PingFang SC', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 8px 32px rgba(0,0,0,0.5)',
            'glow-blue': '0 0 20px rgba(74,144,226,0.12)',
            'glow-purple': '0 0 20px rgba(124,92,255,0.15)',
          },
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(13,17,23,0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid #1E2A3A;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .blue-gradient {
      background: linear-gradient(135deg, #4A90E2 0%, #6BA3F5 100%);
    }
    .timeline-line {
      position: absolute;
      left: 11px;
      top: 24px;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, #1E2A3A 0%, #4A5A70 100%);
    }
    .timeline-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .slide-up-sheet {
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
    }
    .slide-up-sheet.active {
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-bg font-sans text-t1 min-h-screen pb-20">
  <!-- AppBar -->
  <div class="glass-card sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
    <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 active:bg-white/10 transition-colors">
      <span class="material-icons text-primary text-2xl">arrow_back</span>
    </button>
    <h1 class="text-base font-medium text-t1">设备详情</h1>
    <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 active:bg-white/10 transition-colors">
      <span class="material-icons text-t2 text-2xl">edit</span>
    </button>
  </div>

  <!-- Hero Image Area -->
  <div class="relative w-full h-[240px] overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-slate-800 via-slate-900 to-bg flex items-center justify-center">
      <div class="text-center">
        <span class="material-icons text-t3/30 text-8xl">tablet_mac</span>
      </div>
    </div>
    <!-- Swipe Dots -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">
      <div class="w-2 h-2 rounded-full bg-primary"></div>
      <div class="w-2 h-2 rounded-full bg-t3/50"></div>
      <div class="w-2 h-2 rounded-full bg-t3/50"></div>
    </div>
    <!-- Status Banner -->
    <div class="absolute top-4 left-4 px-3 py-1.5 rounded-full bg-success/20 border border-success/30">
      <span class="text-success text-xs font-medium">在库</span>
    </div>
  </div>

  <div class="px-4 -mt-6 relative z-10">
    <!-- Device Info Card -->
    <div class="glass-card rounded-xl p-4 mb-4">
      <h2 class="text-lg font-bold text-t1 mb-4">iPad Pro 12.9 英寸 · 2022款</h2>

      <!-- Specs Grid -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white/5 rounded-lg p-3">
          <p class="text-t3 text-[11px] mb-1">容量</p>
          <p class="text-t1 text-[13px] font-semibold">256GB</p>
        </div>
        <div class="bg-white/5 rounded-lg p-3">
          <p class="text-t3 text-[11px] mb-1">颜色</p>
          <p class="text-t1 text-[13px] font-semibold">深空灰</p>
        </div>
        <div class="bg-white/5 rounded-lg p-3">
          <p class="text-t3 text-[11px] mb-1">网络</p>
          <p class="text-t1 text-[13px] font-semibold">WiFi+5G</p>
        </div>
        <div class="bg-white/5 rounded-lg p-3">
          <p class="text-t3 text-[11px] mb-1">成色</p>
          <p class="text-t1 text-[13px] font-semibold">A级</p>
        </div>
      </div>
    </div>

    <!-- Price Section -->
    <div class="glass-card rounded-xl p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-t3 text-xs">收购价</span>
        <span class="text-success text-[17px] font-bold">¥5,200</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-t3 text-xs">建议售价</span>
        <div class="flex items-center gap-2">
          <span class="text-primary text-[17px] font-bold">¥6,580</span>
          <span class="px-2 py-0.5 rounded-full bg-accent/20 text-accent text-[10px] font-medium">AI定价</span>
        </div>
      </div>
    </div>

    <!-- AI Pricing Card -->
    <div class="glass-card rounded-xl p-4 mb-4 border border-accent/30 shadow-glow-purple">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-lg bg-accent/10 flex items-center justify-center flex-shrink-0">
          <span class="material-icons text-accent text-xl">psychology</span>
        </div>
        <div class="flex-1">
          <h3 class="text-t1 text-sm font-medium mb-1">AI定价建议</h3>
          <p class="text-t3 text-xs mb-2">基于市场数据 + 设备成色</p>
          <div class="flex items-center gap-2">
            <div class="flex-1 h-1.5 bg-white/10 rounded-full overflow-hidden">
              <div class="h-full bg-accent rounded-full" style="width: 96%"></div>
            </div>
            <span class="text-accent text-xs font-medium">96%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Timeline Section -->
    <div class="glass-card rounded-xl p-4 mb-4">
      <div class="flex items-center gap-2 mb-4">
        <span class="material-icons text-primary text-lg">timeline</span>
        <h3 class="text-t1 text-sm font-medium">设备动态</h3>
      </div>

      <!-- Timeline Items -->
      <div class="relative pl-6">
        <div class="timeline-line"></div>

        <!-- Item 1 -->
        <div class="relative flex items-start gap-3 pb-5">
          <div class="timeline-dot bg-success/20 border-2 border-success absolute left-0">
            <div class="w-2 h-2 rounded-full bg-success"></div>
          </div>
          <div class="ml-4">
            <p class="text-t1 text-sm">入库登记完成</p>
            <p class="text-t3 text-xs mt-0.5">06-15 14:32</p>
          </div>
        </div>

        <!-- Item 2 -->
        <div class="relative flex items-start gap-3 pb-5">
          <div class="timeline-dot bg-primary/20 border-2 border-primary absolute left-0">
            <div class="w-2 h-2 rounded-full bg-primary"></div>
          </div>
          <div class="ml-4">
            <p class="text-t1 text-sm">价格调整</p>
            <p class="text-t3 text-xs mt-0.5">06-18 09:15</p>
          </div>
        </div>

        <!-- Item 3 (Current) -->
        <div class="relative flex items-start gap-3">
          <div class="timeline-dot bg-warning/20 border-2 border-warning absolute left-0 ring-4 ring-warning/20">
            <div class="w-2 h-2 rounded-full bg-warning"></div>
          </div>
          <div class="ml-4">
            <p class="text-warning text-sm font-medium">标记滞销</p>
            <p class="text-t3 text-xs mt-0.5">06-25 16:48</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons (Fixed Bottom) -->
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-bg via-bg/95 to-transparent">
    <div class="glass-card rounded-xl p-3 flex gap-3">
      <button class="flex-1 py-3 rounded-lg border border-t3/30 text-t1 text-sm font-medium hover:bg-white/5 active:bg-white/10 transition-colors">
        编辑信息
      </button>
      <button id="outboundBtn" class="flex-1 py-3 rounded-lg blue-gradient text-white text-sm font-medium shadow-glow-blue hover:opacity-90 active:opacity-80 transition-opacity">
        申请出库
      </button>
    </div>
  </div>

  <!-- Slide-up Sheet -->
  <div id="slideSheet" class="slide-up-sheet fixed inset-0 top-auto z-[100]">
    <div class="absolute inset-0 bg-black/60" onclick="toggleSheet()"></div>
    <div class="relative glass-card rounded-t-2xl p-4 pb-8 max-h-[70vh] overflow-auto">
      <!-- Handle Bar -->
      <div class="w-10 h-1 bg-t3/30 rounded-full mx-auto mb-4"></div>
      <h3 class="text-t1 text-base font-medium text-center mb-6">选择出库方式</h3>

      <!-- Options -->
      <div class="space-y-3">
        <button class="w-full glass-card rounded-xl p-4 flex items-center gap-4 hover:bg-white/5 active:bg-white/10 transition-colors">
          <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center">
            <span class="material-icons text-primary text-2xl">receipt_long</span>
          </div>
          <span class="flex-1 text-left text-t1 text-sm">创建订单售出</span>
          <span class="material-icons text-t3">chevron_right</span>
        </button>

        <button class="w-full glass-card rounded-xl p-4 flex items-center gap-4 hover:bg-white/5 active:bg-white/10 transition-colors">
          <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center">
            <span class="material-icons text-primary text-2xl">undo</span>
          </div>
          <span class="flex-1 text-left text-t1 text-sm">退还供应商</span>
          <span class="material-icons text-t3">chevron_right</span>
        </button>

        <button class="w-full glass-card rounded-xl p-4 flex items-center gap-4 hover:bg-white/5 active:bg-white/10 transition-colors">
          <div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center">
            <span class="material-icons text-primary text-2xl">person</span>
          </div>
          <span class="flex-1 text-left text-t1 text-sm">内部领用</span>
          <span class="material-icons text-t3">chevron_right</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function toggleSheet() {
      document.getElementById('slideSheet').classList.toggle('active');
    }
    document.getElementById('outboundBtn').addEventListener('click', toggleSheet);
  </script>
</body>
</html>
