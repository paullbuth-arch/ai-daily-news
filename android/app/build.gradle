plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def releaseStoreFilePath = localProperties.getProperty('release.storeFile')
def releaseKeyAlias = localProperties.getProperty('release.keyAlias')
def releaseStorePassword = localProperties.getProperty('release.storePassword')
def releaseKeyPassword = localProperties.getProperty('release.keyPassword')
def releaseSigningConfigured = releaseStoreFilePath &&
        releaseKeyAlias &&
        releaseStorePassword &&
        releaseKeyPassword
def releaseSigningRequired = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}

android {
    namespace "com.ipadboss.ipad_boss_app"
    compileSdkVersion 36
    buildToolsVersion "36.0.0"
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.ipadboss.ipad_boss_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
}

gradle.projectsEvaluated {
    if (releaseSigningRequired && !releaseSigningConfigured) {
        throw new GradleException("Release signing is not configured. Run tools/build_apk.ps1 after setting tools/build_env.local.ps1.")
    }
}
